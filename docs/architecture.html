<title>WidgetBoard Architecture</title>
<!--
  Architecture map. Edit MAP below; the drawing code needs no changes.
  Arrows mean influence: A -> B = a change in A can affect B.
    data   : writer -> store, store -> reader (both: reads and writes)
    event  : sender -> receiver (Tauri events and commands)
    signal : the board pushing state into a widget (day change, leftover runs, alerts)
    import : imported module -> importer
  Split a node later: give the new nodes `parent: "<id>"`; the old node becomes a box around them.
  After reviewing code changes, set meta.mappedAt to the newest commit (the banner shows it).
-->
<script>

  meta: {
    repo: "104-bookwyrm/WidgetBoard",

    // used everywhere (strings, icons, styles, the browser mock): a change here is a general notice, not a node badge
    shared: ["ui/i18n.js", "ui/icons.js", "ui/theme.js", "ui/base.css", "ui/default-theme.css", "ui/locales/", "ui/fonts/", "ui/icons/", "ui/mock-tauri.js", "ui/ai-theme-prompt.md"],

  layout: {},

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
header { padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
h1 { font-size: 16px; margin: 0 8px 0 0; }
.ctl { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.ctl label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
.sw { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }
.sw.event { border-top-style: dashed; } .sw.signal { border-top-style: dashed; } .sw.import { border-top-style: dotted; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; border: 2px solid; }
select, button { font: inherit; color: var(--text); background: var(--node); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
button { cursor: pointer; }
#banner { padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); border-left: 4px solid var(--err); }
#banner.ok { border-left-color: var(--ok); } #banner.stale { border-left-color: var(--warn); } #banner.error { border-left-color: var(--err); }
#banner details { margin-top: 4px; } #banner ul { margin: 4px 0; padding-left: 20px; }
code { font: 12px ui-monospace, Consolas, monospace; background: var(--bg); padding: 1px 4px; border-radius: 4px; word-break: break-all; }
main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; min-width: 0; position: relative; }
#cy { position: absolute; inset: 0; }
#tip { position: absolute; z-index: 5; max-width: 360px; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 14px rgb(0 0 0 / .15); }
#view { position: absolute; top: 10px; left: 10px; z-index: 4; width: 200px; max-height: calc(100% - 60px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px 10px; font-size: 13px; box-shadow: 0 2px 10px rgb(0 0 0 / .08); }
#view:not([open]) { width: auto; padding-bottom: 6px; }
#view summary { cursor: pointer; font-weight: 600; }
#view h4 { margin: 10px 0 3px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
#view label { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 1px 0; }
#view .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 14px; height: 10px; border: 2px solid; border-radius: 3px; display: inline-block; }
#view .meta { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
#view textarea { width: 100%; font: 11px ui-monospace, Consolas, monospace; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; }
#legend { position: absolute; left: 12px; bottom: 10px; z-index: 4; display: flex; flex-wrap: wrap; gap: 4px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; color: var(--muted); font-size: 12px; }
#legend > span, #legendDir { display: inline-flex; gap: 4px 14px; align-items: center; flex-wrap: wrap; }
#tip .meta, .sum .meta { color: var(--muted); font-size: 12px; }
.sum li { border-bottom: 0; padding: 2px 0; }
#sideHide { display: block; margin: -4px 0 8px auto; font-size: 12px; }
#sideShow { position: absolute; top: 10px; right: 10px; z-index: 4; }
header h1 { flex: 1; }
#memoToggle[aria-pressed="true"] { background: var(--bg); }
#memo { border-top: 1px solid var(--line); background: var(--panel); padding: 8px 16px 10px; }
#memo textarea { width: 100%; font: 13px/1.45 system-ui, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; }
#memo .btns { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
#memo .meta { color: var(--muted); font-size: 12px; }
#memo .right { margin-left: auto; }
.nid { font-weight: 700; font-size: 14px; margin: 2px 0; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
aside { width: 340px; border-left: 1px solid var(--line); background: var(--panel); padding: 14px 16px; overflow: auto; }
aside h2 { font-size: 16px; margin: 0 0 2px; } aside h3 { font-size: 13px; margin: 14px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
aside ul { margin: 0; padding-left: 0; list-style: none; } aside li { padding: 4px 0; border-bottom: 1px solid var(--line); }
aside .meta { color: var(--muted); font-size: 12px; }
a { color: var(--k-data); }
.kind { font-size: 11px; padding: 0 5px; border-radius: 4px; border: 1px solid; margin-right: 4px; }
.flag { color: var(--changed-line); font-weight: 600; }
@media (max-width: 800px) {
  main { flex-direction: column; } #stage { min-height: 60vh; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <h1>WidgetBoard architecture</h1>
  <button id="memoToggle" aria-pressed="true" title="Show or hide the memo">Memo</button>
</header>
<div id="banner">Checking for code changes...</div>
<main>
  <div id="stage"><div id="cy"></div><div id="tip" hidden></div>
    <button id="sideShow" hidden title="Show the details panel">&laquo; Details</button>
    <details id="view" open><summary>View</summary>
      <h4>Links</h4><div id="kinds"></div>
      <h4>Layers</h4><div id="layers"></div>
      <h4>Widget groups</h4><div id="groups"></div>
      <h4>Display</h4>
      <label><input type="checkbox" id="showUtil"> Show util</label>
      <label title="Steps between features; passing through a store does not count">Trace <select id="depth"><option value="1" selected>1 step</option><option value="2">2 steps</option><option value="3">3 steps</option></select></label>
      <div id="hiddenRow" hidden><h4>Hidden</h4><span class="meta"></span> <button id="showAll">Show all</button></div>
      <h4>Layout</h4>
      <div class="btns"><button id="fit">Fit</button><button id="copyLayout" title="Copy positions for MAP.layout in this file">Copy layout</button><button id="resetLayout" title="Forget this browser's layout">Reset</button></div>
      <p id="layoutSrc" class="meta"></p>
      <textarea id="layoutText" rows="6" hidden></textarea>
    </details>
    <div id="legend" class="meta">
      <span id="legendDir" hidden>
        <span><i class="dot" style="border-color:var(--up)"></i> Upstream: can affect it</span>
        <span><i class="dot" style="border-color:var(--down)"></i> Downstream: it can affect</span>
        <span><i class="dot" style="border-color:var(--both)"></i> Both</span>
      </span>
      <span><i class="dot" style="border-color:var(--changed-line);background:var(--changed)"></i> Code changed</span>
    </div>
  </div>
  <aside id="side">
    <button id="sideHide" title="Hide the details panel">Hide panel &raquo;</button>
    <div id="panel"><p class="meta">Hover a node to preview what it touches; click to pin it. Arrows point the way influence flows.</p></div>
  </aside>
</main>
<section id="memo">
  <textarea id="memoText" rows="4" placeholder="Memo for a discussion. Mention nodes as @timer, @events, @w-diary (the bold @id in node details). Kept until the page closes."></textarea>
  <div class="btns"><button id="memoCopy">Copy for chat</button><span id="memoMsg" class="meta"></span><button id="memoHide" class="right">Hide memo</button></div>
  <textarea id="memoOut" rows="6" readonly hidden></textarea>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script>
const KINDS = { data: "Data", event: "Event / command", signal: "Board signal", import: "Import" };
const nodeById = Object.fromEntries(MAP.nodes.map((n) => [n.id, n]));
const changedFiles = {}; // node id -> [file]
let selected = null; // traced node id
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ghFile = (path, ref = MAP.meta.mappedAt) => `https://github.com/${MAP.meta.repo}/${path.endsWith("/") ? "tree" : "blob"}/${ref}/${path}`;
const ghLine = (at) => { const [p, l] = at.split(/:(?=\d+$)/); return ghFile(p) + (l ? "#L" + l : ""); };
const matches = (file, pattern) => (pattern.endsWith("/") ? file.startsWith(pattern) : file === pattern);

// ---- elements: one box per layer, one per widget group; a node with children becomes a box too ----
const parents = new Set(MAP.nodes.map((n) => n.parent).filter(Boolean));
const groupLabel = Object.fromEntries(MAP.groups.map((g) => [g.id, g.label]));
const COL_W = 230, ROW_H = 58, BOX_GAP = 34;
const colX = {}, colY = {}; // colY by "layer:subcolumn"
let x = 0;
for (const l of MAP.layers) {
  colX[l.id] = x;
  x += (l.id === "widgets" ? Math.max(...MAP.groups.map((g) => g.col)) + 1 : 1) * COL_W;
}
const elements = MAP.layers.map((l) => ({ data: { id: "L-" + l.id, label: l.label }, classes: "layer L-" + l.id }));
function place(n, parent, sub = 0) {
  const k = n.layer + ":" + sub;
  colY[k] ??= 0;
  const extra = (n.groups || []).slice(1).map((g) => groupLabel[g]);
  const el = { data: { id: n.id, layer: n.layer, label: n.label + (extra.length ? "\nalso " + extra.join(", ") : ""), parent }, classes: [n.helper && "helper", extra.length && "multi"].filter(Boolean).join(" ") };
  if (parents.has(n.id)) colY[k] += BOX_GAP; // room for the box label
  else { el.position = { x: colX[n.layer] + sub * COL_W, y: colY[k] }; colY[k] += ROW_H; }
  elements.push(el);
}
for (const n of MAP.nodes) if (n.layer !== "widgets") place(n, n.parent || "L-" + n.layer);
for (const g of MAP.groups) {
  elements.push({ data: { id: "G-" + g.id, label: g.label, parent: "L-widgets" }, classes: "group" });
  colY["widgets:" + g.col] = (colY["widgets:" + g.col] ?? 0) + BOX_GAP;
  for (const n of MAP.nodes) if (n.groups?.[0] === g.id) place(n, "G-" + g.id, g.col);
  colY["widgets:" + g.col] += 16; // gap between boxes
}
for (const n of MAP.nodes) if (n.layer === "widgets" && !n.groups?.length) place(n, "L-widgets"); // not grouped yet
MAP.edges.forEach((e, i) =>
  elements.push({ data: { id: "e" + i, source: e.from, target: e.to, idx: i }, classes: [e.kind, e.both && "both", e.helper && "helper"].filter(Boolean).join(" ") }),
);

function style() {
  const s = [
    { selector: "node", style: { label: "data(label)", shape: "round-rectangle", width: 150, height: 34, "font-size": 12, color: css("--text"),
      "text-valign": "center", "text-halign": "center", "background-color": css("--node"), "border-width": 1.5, "border-color": css("--line") } },
    // each layer: its own shape and colours (no layer backgrounds; the layer name is a plain heading)
    ...MAP.layers.map((l) => ({ selector: `node[layer = "${l.id}"]`, style: { shape: l.shape, "background-color": css("--F-" + l.id), "border-color": css("--B-" + l.id) } })),
    { selector: ":parent", style: { shape: "round-rectangle", "text-valign": "top", "text-halign": "center", "font-weight": 600, padding: 12, "background-opacity": 0.3 } },
    { selector: "node.layer", style: { "font-size": 13, "text-margin-y": -4, padding: 18, "border-width": 0, events: "no", "background-opacity": 0 } },
    { selector: "node.group", style: { "font-size": 12, color: css("--muted"), "background-opacity": 0, "border-width": 1, "border-style": "dashed", "border-color": css("--line"), padding: 10 } },
    { selector: "node.multi", style: { "text-wrap": "wrap", height: 42, "line-height": 1.3 } },
    { selector: "edge", style: { width: 1.6, "curve-style": "bezier", "target-arrow-shape": "triangle", "arrow-scale": 0.9, opacity: 0.3 } },
    ...Object.keys(KINDS).map((k) => ({ selector: "edge." + k, style: { "line-color": css("--k-" + k), "target-arrow-color": css("--k-" + k), "source-arrow-color": css("--k-" + k) } })),
    { selector: "edge.both", style: { "source-arrow-shape": "triangle" } },
    { selector: "edge.event", style: { "line-style": "dashed" } },
    { selector: "edge.signal", style: { "line-style": "dashed", "line-dash-pattern": [2, 4] } },
    { selector: "edge.import", style: { "line-style": "dotted", width: 1.3 } },
    { selector: "node.changed", style: { "background-color": css("--changed"), "border-color": css("--changed-line"), "border-style": "dashed" } },
    { selector: "node.faded", style: { opacity: 0.2 } },
    { selector: "edge.faded", style: { opacity: 0.06 } },
    { selector: "edge:selected", style: { opacity: 1, width: 3 } },
    // in a trace, edges take the direction colour; their kind stays readable as the line style
    ...[["up", "--up"], ["down", "--down"], ["updown", "--both"]].map(([c, v]) => ({
      selector: "edge." + c, style: { opacity: 1, width: 2.6, "line-color": css(v), "target-arrow-color": css(v), "source-arrow-color": css(v) } })),
    { selector: "node.up", style: { "border-color": css("--up"), "border-width": 3, "border-style": "solid" } },
    { selector: "node.down", style: { "border-color": css("--down"), "border-width": 3, "border-style": "solid" } },
    { selector: "node.up.down", style: { "border-color": css("--both") } },
    { selector: "node.focus", style: { "border-color": css("--text"), "border-width": 3.5, "border-style": "solid" } },
    { selector: ".hidden", style: { display: "none" } },
  ];
  return s;
}

const cy = cytoscape({ container: document.getElementById("cy"), elements, style: style(), layout: { name: "preset", padding: 30 }, minZoom: 0.2, maxZoom: 3 });
if (innerWidth < 800) document.getElementById("view").open = false; // on a phone the panel would cover the graph
/** Fit what is visible into the space right of the View panel. */
function fitView() {
  const view = document.getElementById("view");
  const off = view.open ? view.offsetWidth + 20 : 0, pad = 30;
  const bb = cy.elements(":visible").boundingBox();
  const w = cy.width() - off - pad * 2, h = cy.height() - pad * 2;
  const z = Math.max(cy.minZoom(), Math.min(w / bb.w, h / bb.h, 1.5));
  cy.zoom(z);
  cy.pan({ x: off + pad + (w - bb.w * z) / 2 - bb.x1 * z, y: pad + (h - bb.h * z) / 2 - bb.y1 * z });
}
// ---- saved layout: this browser's (auto-saved on drag) > the file's MAP.layout > automatic columns ----
const LAYOUT_KEY = "wb-architecture-layout";
const leaves = () => cy.nodes().filter((n) => !n.isParent() && nodeById[n.id()]);
const autoPos = Object.fromEntries(elements.filter((e) => e.position).map((e) => [e.data.id, { ...e.position }])); // copies: cytoscape moves the originals
function readLocal() {
  try { return JSON.parse(localStorage.getItem(LAYOUT_KEY)) || null; } catch { return null; }
}
function applyLayout() {
  const local = readLocal(), file = Object.keys(MAP.layout || {}).length ? MAP.layout : null;
  const saved = local || file || {};
  leaves().forEach((n) => { const p = saved[n.id()]; n.position(p ? { x: p[0], y: p[1] } : autoPos[n.id()]); });
  document.getElementById("layoutSrc").textContent = local ? "Saved in this browser." : file ? "From the file." : "Automatic.";
}
function currentLayout() {
  const out = {};
  leaves().forEach((n) => { const p = n.position(); out[n.id()] = [Math.round(p.x), Math.round(p.y)]; });
  return out;
}
cy.on("dragfree", "node", () => {
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(currentLayout())); } catch {} // private window: the layout just isn't kept
  document.getElementById("layoutSrc").textContent = "Saved in this browser.";
});
document.getElementById("resetLayout").addEventListener("click", () => {
  try { localStorage.removeItem(LAYOUT_KEY); } catch {}
  applyLayout();
  fitView();
});
/** Clipboard copy; without clipboard access the text goes into `box` (a textarea), selected for a manual copy. */
async function copyOut(text, box, msg, done, manual) {
  try {
    await navigator.clipboard.writeText(text);
    box.hidden = true;
    msg.textContent = done;
  } catch {
    box.hidden = false;
    box.value = text;
    box.select();
    msg.textContent = manual;
  }
}
document.getElementById("copyLayout").addEventListener("click", () => {
  const text = "  layout: {\n" + Object.entries(currentLayout()).map(([id, p]) => `    ${JSON.stringify(id)}: [${p.join(", ")}],`).join("\n") + "\n  },";
  copyOut(text, document.getElementById("layoutText"), document.getElementById("layoutSrc"),
    "Copied. Paste it over the layout: line in MAP and commit.", "Copy this and paste it over the layout: line in MAP.");
});
applyLayout();

// ---- details panel show/hide, remembered per browser; clicking a node never reopens it ----
const SIDE_KEY = "wb-architecture-side-hidden";
function setSide(hidden, save = true) {
  document.getElementById("side").hidden = hidden;
  document.getElementById("sideShow").hidden = !hidden;
  if (save) try { localStorage.setItem(SIDE_KEY, hidden ? "1" : ""); } catch {}
  cy.resize();
  fitView();
}
document.getElementById("sideHide").addEventListener("click", () => setSide(true));
document.getElementById("sideShow").addEventListener("click", () => setSide(false));
try { document.getElementById("side").hidden = !!localStorage.getItem(SIDE_KEY); } catch {}
document.getElementById("sideShow").hidden = !document.getElementById("side").hidden;
requestAnimationFrame(() => (cy.resize(), fitView())); // the preset layout does not fit on its own
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => cy.style(style()));

// ---- view: link kinds, layers, widget groups, hidden nodes. Hiding is visual only; a trace still walks hidden nodes. ----
const on = { kind: {}, layer: {}, group: {} };
const hiddenNodes = new Set();
const checks = (type, items) =>
  items.map(([id, label, extra = ""]) => ((on[type][id] = true), `<label><input type="checkbox" data-${type}="${id}" checked>${extra}${esc(label)}</label>`)).join("");
document.getElementById("kinds").innerHTML = checks("kind", Object.entries(KINDS).map(([k, l]) => [k, l, `<i class="sw ${k}" style="border-color:var(--k-${k})"></i>`]));
document.getElementById("layers").innerHTML = checks("layer", MAP.layers.map((l) => [l.id, l.label, `<i class="swatch" style="background:var(--F-${l.id});border-color:var(--B-${l.id})"></i>`]));
document.getElementById("groups").innerHTML = checks("group", MAP.groups.map((g) => [g.id, g.label]));
const showUtil = document.getElementById("showUtil");
const depthSel = document.getElementById("depth");
/** Edges a trace may walk: kind switched on, util only when shown. */
const visibleEdge = (e) => on.kind[e.kind] && (!e.helper || showUtil.checked);
function nodeShown(n) {
  if (!on.layer[n.layer] || hiddenNodes.has(n.id) || (n.helper && !showUtil.checked)) return false;
  if (n.groups?.length && !n.groups.some((g) => on.group[g])) return false; // shown while any of its groups is on
  return !n.parent || nodeShown(nodeById[n.parent]);
}
function applyFilters() {
  for (const n of MAP.nodes) cy.getElementById(n.id).toggleClass("hidden", !nodeShown(n));
  for (const l of MAP.layers) cy.getElementById("L-" + l.id).toggleClass("hidden", !on.layer[l.id]);
  for (const g of MAP.groups) cy.getElementById("G-" + g.id).toggleClass("hidden", !MAP.nodes.some((n) => n.groups?.[0] === g.id && nodeShown(n)));
  cy.edges().forEach((el) => {
    const e = MAP.edges[el.data("idx")];
    el.toggleClass("hidden", !visibleEdge(e) || !nodeShown(nodeById[e.from]) || !nodeShown(nodeById[e.to]));
  });
  const row = document.getElementById("hiddenRow");
  row.hidden = !hiddenNodes.size;
  row.querySelector("span").textContent = [...hiddenNodes].map((id) => nodeById[id].label).join(", ");
  if (selected) trace(selected);
}
document.getElementById("view").addEventListener("change", (ev) => {
  const d = ev.target.dataset;
  const type = Object.keys(on).find((t) => t in d);
  if (type) on[type][d[type]] = ev.target.checked;
  if (ev.target === depthSel) return selected && trace(selected);
  applyFilters();
});
document.getElementById("showAll").addEventListener("click", () => (hiddenNodes.clear(), applyFilters()));
function hideNode(id) {
  hiddenNodes.add(id);
  if (selected === id) clearTrace();
  applyFilters();
}
document.getElementById("fit").addEventListener("click", fitView);
applyFilters();

// ---- trace: walk visible edges up (what affects it) and down (what it affects) ----
const isWidget = (id) => nodeById[id].layer === "widgets";
/** Nodes reachable from `start` within `depth` steps. Returns { found, edges (indexes used), via (stores passed), step }. */
function walk(start, dir, depth) {
  const found = new Set(), edges = new Set(), via = {}, step = {};
  let frontier = [[start, false]]; // [node id, entered from a widget]
  for (let d = 0; d < depth && frontier.length; d++) {
    const next = [];
    for (let i = 0; i < frontier.length; i++) {
      const [id, fromWidget] = frontier[i];
      const blockWidgets = fromWidget && nodeById[id].perItem; // one widget's item never reaches another widget
      MAP.edges.forEach((e, idx) => {
        if (!visibleEdge(e)) return;
        const [a, b] = dir === "down" ? [e.from, e.to] : [e.to, e.from];
        const hits = a === id ? [b] : e.both && b === id ? [a] : [];
        // a data node is a pass-through: going through a store does not use up a step
        for (const h of hits) {
          if (h === start || found.has(h) || (blockWidgets && isWidget(h))) continue;
          found.add(h);
          edges.add(idx);
          step[h] = d + 1;
          via[h] = nodeById[id].layer === "data" ? [...(via[id] || []), id] : [];
          if (nodeById[h].layer === "data") frontier.push([h, isWidget(id)]);
          else next.push([h, false]);
        }
      });
    }
    frontier = next;
  }
  return { found, edges, via, step };
}
const legendDir = document.getElementById("legendDir");
const EMPTY_PANEL = '<p class="meta">Hover a node to preview what it touches; click to pin it. Arrows point the way influence flows.</p>';
let traced = null; // last walk, for the panel summary
/** Light up what can affect `id` (upstream) and what it can affect (downstream). Boxes are never coloured. */
function paint(id) {
  const depth = Number(depthSel.value);
  const up = walk(id, "up", depth), down = walk(id, "down", depth);
  const lit = new Set([id, ...up.found, ...down.found]);
  cy.nodes().not(".layer, .group").forEach((n) => {
    const nid = n.id();
    const kids = n.isParent() && n.children().some((c) => lit.has(c.id()));
    n.toggleClass("faded", !lit.has(nid) && !kids).toggleClass("up", up.found.has(nid)).toggleClass("down", down.found.has(nid)).toggleClass("focus", nid === id);
  });
  cy.edges().forEach((el) => {
    const i = el.data("idx"), u = up.edges.has(i), d = down.edges.has(i);
    el.toggleClass("faded", !u && !d).toggleClass("up", u && !d).toggleClass("down", d && !u).toggleClass("updown", u && d);
  });
  legendDir.hidden = false;
  return { up, down };
}
function unpaint() {
  cy.elements().removeClass("faded up down updown focus");
  legendDir.hidden = true;
}
function trace(id) {
  selected = id;
  traced = paint(id);
  showPanel(id);
}
function clearTrace() {
  selected = traced = null;
  unpaint();
  cy.edges().unselect();
  document.getElementById("panel").innerHTML = EMPTY_PANEL;
}
cy.on("tap", "node", (ev) => !ev.target.hasClass("group") && trace(ev.target.id()));
cy.on("tap", (ev) => ev.target === cy && clearTrace());
// hover previews a trace while nothing is pinned
cy.on("mouseover", "node", (ev) => !selected && !ev.target.hasClass("group") && paint(ev.target.id()));
cy.on("mouseout", "node", () => !selected && unpaint());

// ---- edge hover: note and citations; click pins them in the panel ----
const tip = document.getElementById("tip");
const edgeTitle = (e) => `${esc(nodeById[e.from].label)} ${e.both ? "&harr;" : "&rarr;"} ${esc(nodeById[e.to].label)}`;
cy.on("mouseover", "edge", (ev) => {
  const e = MAP.edges[ev.target.data("idx")], p = ev.renderedPosition;
  tip.innerHTML = `<b>${edgeTitle(e)}</b> <span class="kind" style="color:var(--k-${e.kind})">${esc(KINDS[e.kind])}</span><br>${esc(e.note)}<br><span class="meta">${e.at.map(esc).join("<br>")}</span>`;
  tip.style.left = p.x + 14 + "px";
  tip.style.top = p.y + 14 + "px";
  tip.hidden = false;
});
cy.on("mouseout", "edge", () => (tip.hidden = true));
cy.on("tap", "edge", (ev) => {
  const e = MAP.edges[ev.target.data("idx")];
  if (!selected) unpaint();
  document.getElementById("panel").innerHTML = `<h2>${edgeTitle(e)}</h2><div class="meta">${esc(KINDS[e.kind])}</div><ul>${edgeRow(e, e.from)}</ul>`;
});

function edgeRow(e, other) {
  const k = `<span class="kind" style="color:var(--k-${e.kind})">${esc(KINDS[e.kind])}</span>`;
  const cites = e.at.map((a) => `<a href="${esc(ghLine(a))}" target="_blank" rel="noopener">${esc(a)}</a>`).join(", ");
  return `<li>${k}<b>${esc(nodeById[other]?.label ?? other)}</b>${e.both ? " (both ways)" : ""}<div class="meta">${esc(e.note)}<br>${cites}</div></li>`;
}
function showPanel(id) {
  const n = nodeById[id];
  const ins = MAP.edges.filter((e) => e.to === id || (e.both && e.from === id));
  const outs = MAP.edges.filter((e) => e.from === id || (e.both && e.to === id));
  const list = (es, side) => (es.length ? `<ul>${es.map((e) => edgeRow(e, e.from === id ? e.to : e.from)).join("")}</ul>` : '<p class="meta">Nothing.</p>');
  const layer = MAP.layers.find((l) => l.id === n.layer).label + (n.parent ? " / " + nodeById[n.parent].label : "");
  const kids = MAP.nodes.filter((c) => c.parent === id).map((c) => c.label);
  const changed = changedFiles[id];
  // plain-language answer first: features only, stores named as the route
  const summary = (w) => {
    const ids = [...w.found].filter((x) => nodeById[x].layer !== "data").sort((a, b) => w.step[a] - w.step[b]);
    if (!ids.length) return '<p class="meta">Nothing.</p>';
    return `<ul class="sum">${ids.map((x) => {
      const route = w.via[x].map((v) => nodeById[v].label).join(", ");
      return `<li><b>${esc(nodeById[x].label)}</b>${nodeShown(nodeById[x]) ? "" : ' <span class="meta">(hidden)</span>'}${route ? ` <span class="meta">via ${esc(route)}</span>` : ""}${w.step[x] > 1 ? ` <span class="meta">(${w.step[x]} steps)</span>` : ""}</li>`;
    }).join("")}</ul>`;
  };
  document.getElementById("panel").innerHTML = `
    <div class="ph"><h2>${esc(n.label)}</h2><button onclick="hideNode('${id}')" title="Hide this node; View > Hidden brings it back">Hide node</button></div>
    <div class="nid" title="Write this in the memo to mention the node">@${esc(id)}</div>
    <div class="meta">${esc(layer)}${n.groups?.length ? " / " + esc(n.groups.map((g) => groupLabel[g]).join(", ")) : ""}</div>
    <p>${esc(n.desc)}</p>
    <h3 style="color:var(--up)">Can affect ${esc(n.label)}</h3>${summary(traced.up)}
    <h3 style="color:var(--down)">${esc(n.label)} can affect</h3>${summary(traced.down)}
    ${id === "board" ? '<p class="meta">Every widget runs inside the board; those 14 links are not drawn.</p>' : ""}
    ${kids.length ? `<p class="meta">Contains: ${esc(kids.join(", "))}</p>` : ""}
    ${changed ? `<p class="flag">Code changed since the map was checked:</p><ul>${changed.map((f) => `<li><code>${esc(f)}</code></li>`).join("")}</ul>` : ""}
    <h3>Direct links in</h3>${list(ins)}
    <h3>Direct links out</h3>${list(outs)}
    <h3>Source</h3>${n.src.length ? `<ul>${n.src.map((s) => `<li><a href="${esc(ghFile(s))}" target="_blank" rel="noopener">${esc(s)}</a></li>`).join("")}</ul>` : '<p class="meta">Stored by Native (src-tauri/src/main.rs).</p>'}`;
}

// ---- memo: one text for the whole page, in memory only. @id mentions nodes; the copy adds the stamp and the mentioned nodes ----
const memo = document.getElementById("memoText");
function mapStatus() {
  const c = banner.className;
  if (c === "ok") return "up to date with " + MAP.meta.branch;
  if (c === "stale") return "NEEDS AN UPDATE: code changed since the stamp";
  if (c === "error") return "not checked (" + banner.textContent.trim() + ")";
  return "check still running";
}
/** @mentions in the memo: known node ids in order of first use, and the unknown ones. */
function mentions(text) {
  const all = [...new Set([...text.matchAll(/@([\w-]+)/g)].map((m) => m[1]))];
  return { known: all.filter((id) => nodeById[id]), unknown: all.filter((id) => !nodeById[id]) };
}
function showUnknown() {
  const { unknown } = mentions(memo.value);
  document.getElementById("memoMsg").textContent = unknown.length ? "Not a node: " + unknown.map((u) => "@" + u).join(", ") : "";
}
memo.addEventListener("input", showUnknown);
document.getElementById("memoCopy").addEventListener("click", () => {
  const { known } = mentions(memo.value);
  const layerOf = (n) => MAP.layers.find((l) => l.id === n.layer).label + (n.groups?.length ? " / " + n.groups.map((g) => groupLabel[g]).join(", ") : "");
  const text = [
    `WidgetBoard architecture map (docs/architecture.html, MAP). Stamp ${MAP.meta.mappedAt.slice(0, 7)}, ${mapStatus()}.`,
    ...(known.length ? ["Nodes mentioned (@id = MAP node id):", ...known.map((id) => {
      const n = nodeById[id], files = changedFiles[id];
      return `- @${id}: ${n.label} (${layerOf(n)})${n.src.length ? ", " + n.src.join(", ") : ""}${files ? `. CODE CHANGED since the stamp: ${files.join(", ")}` : ""}`;
    })] : []),
    "",
    memo.value,
  ].join("\n");
  copyOut(text, document.getElementById("memoOut"), document.getElementById("memoMsg"), "Copied with the map stamp.", "Clipboard blocked: copy this by hand.");
});
// dock show/hide (open by default; the text survives hiding)
function setMemo(open) {
  document.getElementById("memo").hidden = !open;
  document.getElementById("memoToggle").setAttribute("aria-pressed", open);
  cy.resize();
}
document.getElementById("memoToggle").addEventListener("click", () => setMemo(document.getElementById("memo").hidden));
document.getElementById("memoHide").addEventListener("click", () => setMemo(false));

// ---- update check: which code files changed on GitHub since meta.mappedAt ----
const banner = document.getElementById("banner");
const setBanner = (cls, html) => ((banner.className = cls), (banner.innerHTML = html));
async function check() {
  const { repo, branch, mappedAt, watch, shared } = MAP.meta;
  const short = mappedAt.slice(0, 7);
  let r;
  try {
    r = await fetch(`https://api.github.com/repos/${repo}/compare/${mappedAt}...${branch}`, { headers: { Accept: "application/vnd.github+json" }, signal: AbortSignal.timeout(10000) });
  } catch {
    return setBanner("error", `Couldn't check for code changes (GitHub did not answer). The map may be out of date. Mapped at <code>${short}</code>.`);
  }
  if (r.status === 404) return setBanner("error", `Couldn't check: commit <code>${short}</code> is not on GitHub's <code>${esc(branch)}</code>. Push it, or fix meta.mappedAt.`);
  if (r.status === 403 || r.status === 429) {
    const reset = Number(r.headers.get("x-ratelimit-reset")) * 1000;
    return setBanner("error", `Couldn't check: GitHub's hourly limit was reached${reset ? ", try again after " + new Date(reset).toLocaleTimeString() : ""}.`);
  }
  if (!r.ok) return setBanner("error", `Couldn't check: GitHub answered ${r.status}.`);
  const j = await r.json();
  const latest = j.commits?.length ? j.commits[j.commits.length - 1].sha : mappedAt;
  const byNode = {}, sharedHits = [], unmapped = [];
  for (const f of j.files || []) {
    const names = [f.filename, f.previous_filename].filter(Boolean);
    if (!names.some((nm) => watch.some((w) => matches(nm, w)))) continue;
    const label = f.filename + (f.status === "removed" ? " (removed)" : f.status === "renamed" ? ` (renamed from ${f.previous_filename})` : "");
    const owners = MAP.nodes.filter((n) => n.src.some((s) => names.some((nm) => matches(nm, s))));
    if (owners.length) owners.forEach((n) => (byNode[n.id] ??= []).push(label));
    else if (names.some((nm) => shared.some((s) => matches(nm, s)))) sharedHits.push(label);
    else unmapped.push(label);
  }
  const ids = Object.keys(byNode);
  Object.assign(changedFiles, byNode);
  ids.forEach((id) => cy.getElementById(id).addClass("changed"));
  const truncated = (j.files || []).length >= 300 ? " GitHub lists at most 300 files, so some may be missing." : "";
  if (!ids.length && !sharedHits.length && !unmapped.length)
    return setBanner("ok", `Up to date. ${j.ahead_by ? `${j.ahead_by} newer commit(s) on ${esc(branch)}, none touch mapped code.` : `Matches ${esc(branch)}.`} Mapped at <code>${short}</code>.${truncated}`);
  const li = (xs) => `<ul>${xs.map((x) => `<li><code>${esc(x)}</code></li>`).join("")}</ul>`;
  setBanner("stale", `<b>Needs an update.</b> Code changed since <code>${short}</code>: ${ids.length} node(s) marked${unmapped.length ? `, ${unmapped.length} file(s) no node covers` : ""}${sharedHits.length ? `, ${sharedHits.length} shared file(s)` : ""}.${truncated}
    <details><summary>Details and how to re-stamp</summary>
      ${ids.length ? `<p>Changed nodes:</p><ul>${ids.map((id) => `<li><b>${esc(nodeById[id].label)}</b>: ${byNode[id].map((f) => `<code>${esc(f)}</code>`).join(" ")}</li>`).join("")}</ul>` : ""}
      ${unmapped.length ? `<p>Not covered by any node (new feature? add a node or add it to a node's src):</p>${li(unmapped)}` : ""}
      ${sharedHits.length ? `<p>Shared files (strings, icons, styles):</p>${li(sharedHits)}` : ""}
      <p>After checking the edges above against the code, set <code>meta.mappedAt</code> to <code>${esc(latest)}</code>.
      <a href="https://github.com/${esc(repo)}/compare/${mappedAt}...${esc(branch)}" target="_blank" rel="noopener">See the diff on GitHub</a>.</p>
    </details>`);
}
check().catch((e) => setBanner("error", "Couldn't check: " + esc(e.message || e)));
</script>
</body>
</html>
