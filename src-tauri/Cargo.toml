[package]
name = "widgetboard"
version = "0.11.0"
description = "Lightweight, grid-based desktop widgets for Windows"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
base64 = "0.22"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
# self-update: release signatures + hashes (pure Rust, small)
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
  "Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_WinRT",
  "Web_Http", "Web_Http_Headers", "Win32_System_Threading", "Win32_Foundation",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
