name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Rust 1.98.1' }
          rustup default 1.98.1
          if ($LASTEXITCODE -ne 0) { throw 'Could not select Rust 1.98.1' }
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run JavaScript tests
        run: npm test
      - name: Run locked Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned NSIS diagnostic
        run: npx tauri build --bundles nsis --no-sign
      - name: Upload unsigned NSIS diagnostic
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-nsis-diagnostic
          path: src-tauri/target/release/bundle/nsis/*setup.exe
          if-no-files-found: error
