name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run JavaScript tests
        run: npm test
      - name: Run locked Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned NSIS diagnostic
        run: npx tauri build --bundles nsis --no-sign
      - name: Upload unsigned NSIS diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-nsis-diagnostic
          path: src-tauri/target/release/bundle/nsis/*setup.exe
          if-no-files-found: error
