name: Trusted Windows release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: trusted-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.contract.outputs.tag }}
      version: ${{ steps.contract.outputs.version }}
      sha: ${{ steps.contract.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate tag and source contract
        id: contract
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $contextJson = node tools/release/validate.mjs --tag $env:RELEASE_TAG --sha $env:RELEASE_SHA --notes RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release source contract validation failed' }
          $context = $contextJson | ConvertFrom-Json
          "tag=$($context.tag)" >> $env:GITHUB_OUTPUT
          "version=$($context.version)" >> $env:GITHUB_OUTPUT
          "sha=$($context.sha)" >> $env:GITHUB_OUTPUT

  release:
    needs: validate
    runs-on: [self-hosted, windows, x64, widgetboard-release]
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      WIDGETBOARD_AUTHENTICODE_ADAPTER: ${{ vars.WIDGETBOARD_AUTHENTICODE_ADAPTER }}
      WIDGETBOARD_AUTHENTICODE_SUBJECT: ${{ vars.WIDGETBOARD_AUTHENTICODE_SUBJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Rust 1.98.1' }
          rustup default 1.98.1
          if ($LASTEXITCODE -ne 0) { throw 'Could not select Rust 1.98.1' }
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run JavaScript tests
        run: npm test
      - name: Run locked Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build signed NSIS release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          foreach ($name in @('TAURI_SIGNING_PRIVATE_KEY', 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Required Tauri signing input is absent: $name" }
          }
          foreach ($name in @('WIDGETBOARD_AUTHENTICODE_ADAPTER', 'WIDGETBOARD_AUTHENTICODE_SUBJECT')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Required Authenticode input is absent: $name" }
          }
          if (-not (Test-Path -LiteralPath $env:WIDGETBOARD_AUTHENTICODE_ADAPTER -PathType Leaf)) { throw 'Configured Authenticode adapter file is absent on the release runner' }
          npx tauri build --bundles nsis --config src-tauri/tauri.release.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Signed NSIS release build failed' }
      - name: Verify source installer Authenticode signature
        env:
          EXPECTED_SUBJECT: ${{ vars.WIDGETBOARD_AUTHENTICODE_SUBJECT }}
        run: |
          $installer = "src-tauri/target/release/bundle/nsis/WidgetBoard_${env:RELEASE_VERSION}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'Signed Tauri NSIS installer is absent' }
          if (-not (Test-Path -LiteralPath "$installer.sig" -PathType Leaf)) { throw 'Tauri updater signature is absent' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ([string]$signature.Status -cne 'Valid') { throw "Source installer Authenticode status is not Valid: $($signature.Status)" }
          if ([string]$signature.SignerCertificate.Subject -cne $env:EXPECTED_SUBJECT) { throw 'Source installer Authenticode subject mismatch' }
          if (-not $signature.TimeStamperCertificate -or -not $signature.TimeStamperCertificate.Subject) { throw 'Source installer timestamp certificate is absent' }
      - name: Assemble release assets
        run: |
          $installer = "src-tauri/target/release/bundle/nsis/WidgetBoard_${env:RELEASE_VERSION}_x64-setup.exe"
          node tools/release/assemble.mjs --tag $env:RELEASE_TAG --sha $env:RELEASE_SHA --notes RELEASE_NOTES.md --installer $installer --signature "$installer.sig" --evidence "$env:RUNNER_TEMP/widgetboard-authenticode.jsonl"
          if ($LASTEXITCODE -ne 0) { throw 'Release asset assembly failed' }
      - name: Verify assembled release assets
        run: ./tools/release/verify.ps1 -ReleaseDirectory dist/release -ExpectedSubject $env:WIDGETBOARD_AUTHENTICODE_SUBJECT
      - name: Attest final installer digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/WidgetBoard-${{ needs.validate.outputs.version }}-setup-x86_64.exe
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseListJson = gh release list --limit 1000 --json tagName,isDraft
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing releases' }
          $matchingReleases = @($releaseListJson | ConvertFrom-Json | Where-Object { $_.tagName -ceq $env:RELEASE_TAG })
          if ($matchingReleases.Count -gt 1) { throw 'Multiple releases exist for this tag' }
          if ($matchingReleases.Count -eq 1) {
            if (-not $matchingReleases[0].isDraft) { throw 'A published release already exists for this tag' }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "WidgetBoard $env:RELEASE_VERSION" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release' }
          }
      - name: Verify existing draft assets and upload only missing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $expected = @(
            "WidgetBoard-$($env:RELEASE_VERSION)-setup-x86_64.exe",
            "WidgetBoard-$($env:RELEASE_VERSION)-setup-x86_64.exe.sig",
            'latest-installer.json',
            'release-metadata.json',
            'SHA256SUMS.txt'
          ) | Sort-Object
          $releaseJson = gh release view $env:RELEASE_TAG --json isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the draft release assets' }
          $draft = $releaseJson | ConvertFrom-Json
          if (-not $draft.isDraft) { throw 'Refusing to modify a published release' }
          $existingNames = @($draft.assets | ForEach-Object { $_.name })
          $unexpectedNames = @($existingNames | Where-Object { $_ -notin $expected })
          if ($unexpectedNames.Count -gt 0) { throw "Draft contains an unknown asset: $($unexpectedNames -join ', ')" }
          $download = Join-Path $env:RUNNER_TEMP "draft-assets-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $download | Out-Null
          if ($existingNames.Count -gt 0) {
            gh release download $env:RELEASE_TAG --dir $download
            if ($LASTEXITCODE -ne 0) { throw 'Could not download existing draft assets' }
          }
          foreach ($name in $existingNames) {
            $localFile = Join-Path 'dist/release' $name
            $downloadedFile = Join-Path $download $name
            if (-not (Test-Path -LiteralPath $localFile -PathType Leaf) -or -not (Test-Path -LiteralPath $downloadedFile -PathType Leaf)) { throw "Existing draft asset is missing locally or after download: $name" }
            & fc.exe /b $localFile $downloadedFile | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Existing draft asset bytes differ from this build: $name" }
          }
          $missingNames = @($expected | Where-Object { $_ -notin $existingNames })
          if ($missingNames.Count -gt 0) {
            $missingFiles = @($missingNames | ForEach-Object { Join-Path 'dist/release' $_ })
            gh release upload $env:RELEASE_TAG @missingFiles
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload missing draft assets' }
          }
      - name: Verify downloaded draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP "release-draft-download-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download $env:RELEASE_TAG --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Could not download draft release assets' }
      - name: Verify draft release bytes
        run: |
          $download = Join-Path $env:RUNNER_TEMP "release-draft-download-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ./tools/release/verify.ps1 -ReleaseDirectory $download -ExpectedSubject $env:WIDGETBOARD_AUTHENTICODE_SUBJECT
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit $env:RELEASE_TAG --draft=false
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP "release-published-download-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download $env:RELEASE_TAG --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Could not download published release assets' }
      - name: Verify published release bytes
        run: |
          $download = Join-Path $env:RUNNER_TEMP "release-published-download-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ./tools/release/verify.ps1 -ReleaseDirectory $download -ExpectedSubject $env:WIDGETBOARD_AUTHENTICODE_SUBJECT
