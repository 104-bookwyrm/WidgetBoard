<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WidgetBoard</title>
    <link rel="stylesheet" href="default-theme.css" />
    <style id="user-theme"></style>
    <style id="palette-theme"></style>
    <link rel="stylesheet" href="base.css" />
  </head>
  <body>
    <div id="board"></div>

    <!-- edit-mode bar -->
    <div id="editbar" data-hit hidden>
      <span data-i18n="edit.hint"></span>
      <button id="edit-layers" data-i18n="layers.open" hidden></button>
      <button id="edit-done" data-i18n="edit.done"></button>
    </div>

    <!-- free mode: the stacking order, front first (PowerPoint's selection pane, art-program behaviour) -->
    <div id="layers-panel" data-hit hidden role="dialog" aria-labelledby="ly-title">
      <h3 id="ly-title" data-i18n="layers.title"></h3>
      <p class="hint" data-i18n="layers.hint"></p>
      <ul id="layers-list"></ul>
      <div class="row">
        <button id="layers-close" data-i18n="theme.close"></button>
      </div>
    </div>

    <!-- per-widget font panel (right-click → 글꼴) -->
    <div
      id="font-panel"
      data-hit
      hidden
      role="dialog"
      aria-labelledby="fp-title"
    >
      <h3 id="fp-title" data-i18n="look.title"></h3>
      <label
        ><span data-i18n="font.family"></span>
        <input id="fp-family" list="font-list"
      /></label>
      <label
        ><span data-i18n="font.size"></span>
        <span
          ><input id="fp-size" type="range" min="9" max="36" />
          <output id="fp-size-out"></output></span
      ></label>
      <p class="sub" data-i18n="look.colors"></p>
      <label data-col="c1"
        ><span data-i18n="theme.surface"></span>
        <span
          ><input type="color" />
          <button class="mini" data-i18n-title="look.reset_one">↺</button></span
        ></label
      >
      <label data-col="c2"
        ><span data-i18n="theme.accent"></span>
        <span
          ><input type="color" />
          <button class="mini" data-i18n-title="look.reset_one">↺</button></span
        ></label
      >
      <label data-col="c3"
        ><span data-i18n="theme.text"></span>
        <span
          ><input type="color" />
          <button class="mini" data-i18n-title="look.reset_one">↺</button></span
        ></label
      >
      <label data-col="opacity"
        ><span data-i18n="theme.opacity"></span>
        <span
          ><input type="range" min="0" max="1" step="0.05" />
          <button class="mini" data-i18n-title="look.reset_one">↺</button></span
        ></label
      >
      <p class="sub" data-i18n="look.theme"></p>
      <label><span data-i18n="look.theme_widget"></span><select id="fp-theme"></select></label>
      <label><span id="fp-theme-type-label"></span><select id="fp-theme-type"></select></label>
      <p class="sub" data-i18n="look.frame"></p>
      <label
        ><span data-i18n="look.frame_kind"></span>
        <select id="fp-frame">
          <option value="" data-i18n="look.frame.default"></option>
          <option value="none" data-i18n="look.frame.none"></option>
          <option value="corners" data-i18n="look.frame.corners"></option>
          <option value="double" data-i18n="look.frame.double"></option>
          <option value="stitch" data-i18n="look.frame.stitch"></option>
          <option value="dots" data-i18n="look.frame.dots"></option>
          <option value="ornate" data-i18n="look.frame.ornate"></option>
          <option value="pixel" data-i18n="look.frame.pixel"></option>
          <option value="tape" data-i18n="look.frame.tape"></option>
          <option value="custom" data-i18n="look.frame.custom"></option></select
      ></label>
      <label data-col="frame"
        ><span data-i18n="look.frame_color"></span>
        <span
          ><input type="color" />
          <button class="mini" data-i18n-title="look.reset_one">↺</button></span
        ></label
      >
      <button id="fp-svg" data-i18n="look.svg"></button>
      <div class="row">
        <button id="fp-reset" data-i18n="look.reset"></button>
        <button id="fp-close" data-i18n="theme.close"></button>
      </div>
    </div>
    <datalist id="font-list"></datalist>

    <!-- text overview of every widget (screen readers, low vision) -->
    <div
      id="overview-panel"
      data-hit
      hidden
      role="dialog"
      aria-labelledby="ov-title"
    >
      <h3 id="ov-title" data-i18n="ov.title"></h3>
      <ul id="overview-list"></ul>
      <div class="row">
        <button id="overview-close" data-i18n="theme.close"></button>
      </div>
    </div>

    <!-- first run on an empty board -->
    <div id="welcome" data-hit hidden role="dialog" aria-labelledby="wc-title">
      <h3 id="wc-title" data-i18n="wc.title"></h3>
      <div id="wc-intro">
        <p data-i18n="tut.welcome"></p>
        <button id="wc-try" data-i18n="tut.try"></button>
        <button id="wc-skip" data-i18n="tut.skip"></button>
      </div>
      <div id="wc-presets" hidden>
      <p data-i18n="wc.body"></p>
      <div class="wc-presets">
        <button data-preset="work">
          <b data-i18n="lay.work"></b><small data-i18n="lay.work_desc"></small>
        </button>
        <button data-preset="study">
          <b data-i18n="lay.study"></b><small data-i18n="lay.study_desc"></small>
        </button>
        <button data-preset="oshi">
          <b data-i18n="lay.oshi"></b><small data-i18n="lay.oshi_desc"></small>
        </button>
      </div>
      <button id="wc-blank" data-i18n="wc.blank"></button>
      </div>
    </div>

    <div id="focusbar" data-hit hidden>
      <span data-i18n="focus.on"></span>
      <button id="focus-exit" data-i18n="focus.exit"></button>
    </div>
    <div id="kbdbar" data-hit hidden role="status">
      <span data-i18n="kbd.on"></span>
    </div>
    <div id="flash" hidden aria-hidden="true"><b></b></div>

    <div id="toast" data-hit role="status" aria-live="polite" hidden></div>
    <div id="sr" class="sr-only" role="status" aria-live="polite"></div>
    <input type="file" id="file-picker" accept="image/*" hidden />
    <script type="module" src="app.js"></script>
  </body>
</html>
