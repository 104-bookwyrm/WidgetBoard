<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="set.title">설정</title>
    <link rel="stylesheet" href="base.css" />
    <style>
      /* The settings window is a normal opaque window (unlike the transparent boards). */
      html,
      body.settings {
        height: 100%;
      }
      body.settings {
        margin: 0;
        background: var(--c1);
        color: var(--c3);
        font: var(--font-size, 14px) / 1.5 var(--font);
        display: flex;
        flex-direction: column;
      }
      .set-wrap {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .set-nav {
        flex: 0 0 200px;
        border-right: var(--line-width) var(--line-style) var(--line-color);
        padding: 12px 8px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .set-nav button {
        display: block;
        width: 100%;
        text-align: start;
        padding: 10px 12px;
        min-height: 24px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .set-nav button:hover {
        background: color-mix(in srgb, var(--c3) 10%, transparent);
      }
      .set-nav button[aria-current="page"] {
        background: var(--c2);
        color: var(--on-accent);
      }
      .set-nav-select {
        display: none;
        margin: 8px;
        padding: 8px;
        font: inherit;
        background: var(--c1);
        color: var(--c3);
        border: var(--line-width) var(--line-style) var(--line-color);
        border-radius: 8px;
      }
      .set-main {
        flex: 1;
        overflow-y: auto;
        padding: 20px 24px;
        min-width: 0;
      }
      .set-main h2 {
        margin: 0 0 16px;
        font-size: 1.3em;
      }
      .set-main section[hidden] {
        display: none;
      }
      fieldset {
        border: var(--line-width) var(--line-style) var(--line-color);
        border-radius: var(--radius, 12px);
        margin: 0 0 18px;
        padding: 8px 16px 16px;
      }
      legend {
        padding: 0 6px;
        font-weight: 600;
      }
      .set-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 0;
        flex-wrap: wrap;
      }
      .set-row + .set-row {
        border-top: 1px solid color-mix(in srgb, var(--c3) 8%, transparent);
      }
      .set-row label {
        flex: 1;
        min-width: 140px;
      }
      #about-update-notes {
        white-space: pre-wrap;
        font: inherit;
        max-height: 40vh;
        overflow: auto;
      }
      .set-row .hint {
        flex-basis: 100%;
        font-size: 0.85em;
        opacity: 0.7;
        margin-top: -4px;
      }
      .set-row select,
      .set-row input[type="time"],
      .set-row input[type="number"],
      .set-row input[type="text"] {
        font: inherit;
        padding: 6px 8px;
        min-height: 24px;
        background: var(--c1);
        color: var(--c3);
        border: var(--line-width) var(--line-style) var(--line-color);
        border-radius: 8px;
      }
      .set-row input[type="checkbox"] {
        width: 20px;
        height: 20px;
      }
      .set-soon {
        opacity: 0.6;
      }
      .set-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 6px 0;
      }
      .set-list-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .set-list-row .grow {
        flex: 1;
        min-width: 0;
      }
      .set-add {
        justify-content: flex-start;
      }
      .set-list-row input,
      .set-add input {
        font: inherit;
        padding: 6px 8px;
        min-height: 24px;
        background: var(--c1);
        color: var(--c3);
        border: var(--line-width) var(--line-style) var(--line-color);
        border-radius: 8px;
      }
      .set-list-row .del {
        min-width: 32px;
      }
      .set-list-row .muted {
        opacity: 0.7;
        font-size: 0.9em;
        white-space: nowrap;
      }
      .set-list-row.is-hidden input {
        font-style: italic;
        opacity: 0.7;
      }
      .set-list details {
        width: 100%;
      }
      .set-list summary {
        cursor: pointer;
        padding: 4px 0;
      }
      .set-list pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: inherit;
        margin: 0;
        flex: 1;
        min-width: 0;
        max-height: 8em;
        overflow-y: auto;
      }
      .set-row input[type="color"] {
        width: 44px;
        height: 28px;
        padding: 0;
        border: var(--line-width) var(--line-style) var(--line-color);
        border-radius: 6px;
        background: var(--c1);
      }
      #th-paste-result {
        font-size: 0.85em;
        margin: 6px 0;
      }
      #th-paste-result.bad {
        color: #c0392b;
      }
      #th-paste-result.warn {
        opacity: 0.8;
      }
      .set-saved {
        position: fixed;
        inset: auto 16px 16px auto;
        background: var(--c2);
        color: var(--on-accent);
        padding: 8px 14px;
        border-radius: 8px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      .set-saved.show {
        opacity: 1;
      }
      body.reduce-motion .set-saved {
        transition: none;
      }
      /* Narrow / high-zoom: sidebar collapses to a select, no horizontal scroll. */
      @media (max-width: 600px) {
        .set-nav {
          display: none;
        }
        .set-nav-select {
          display: block;
        }
        .set-wrap {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body class="settings">
    <div class="set-saved" role="status" aria-live="polite"></div>
    <div class="set-wrap">
      <nav class="set-nav" aria-label="설정 페이지"></nav>
      <select class="set-nav-select" aria-label="설정 페이지"></select>
      <main class="set-main" tabindex="-1">
        <section data-page="general">
          <h2 data-i18n="set.nav.general">일반</h2>
          <fieldset>
            <legend data-i18n="set.general.behavior">동작</legend>
            <div class="set-row">
              <label for="set-lang" data-i18n="set.general.lang">언어</label>
              <select id="set-lang"></select>
            </div>
            <div class="set-row">
              <label for="set-autostart" data-i18n="set.general.autostart"
                >Windows 시작 시 자동 실행</label
              >
              <input type="checkbox" id="set-autostart" />
              <p
                class="hint"
                id="set-autostart-hint"
                data-i18n="set.general.autostart_disabled"
                hidden
              ></p>
            </div>
            <div class="set-row">
              <label for="set-weekstart" data-i18n="set.general.weekStart"
                >한 주 시작</label
              >
              <select id="set-weekstart">
                <option
                  value="default"
                  data-i18n="set.weekStart.default"
                ></option>
                <option value="mon" data-i18n="set.weekStart.mon"></option>
                <option value="sun" data-i18n="set.weekStart.sun"></option>
              </select>
            </div>
            <div class="set-row">
              <label for="set-tz" data-i18n="set.general.tz">내 시간대</label>
              <select id="set-tz"></select>
            </div>
          </fieldset>
        </section>

        <section data-page="appearance" hidden>
          <h2 data-i18n="set.nav.appearance">모양</h2>

          <fieldset>
            <legend data-i18n="theme.title"></legend>
            <div class="set-row">
              <label for="th-c1" data-i18n="theme.surface"></label>
              <input type="color" id="th-c1" data-var="--c1" />
            </div>
            <div class="set-row">
              <label for="th-c2" data-i18n="theme.accent"></label>
              <input type="color" id="th-c2" data-var="--c2" />
            </div>
            <div class="set-row">
              <label for="th-c3" data-i18n="theme.text"></label>
              <input type="color" id="th-c3" data-var="--c3" />
            </div>
            <div class="set-row">
              <label for="th-font" data-i18n="font.family"></label>
              <input id="th-font" list="th-font-list" />
              <datalist id="th-font-list"></datalist>
            </div>
            <div class="set-row">
              <label for="th-size" data-i18n="font.size"></label>
              <input
                type="range"
                id="th-size"
                min="10"
                max="24"
                data-var="--font-size"
                data-unit="px"
              />
            </div>
            <div class="set-row">
              <label for="th-radius" data-i18n="theme.radius"></label>
              <input
                type="range"
                id="th-radius"
                min="0"
                max="32"
                data-var="--radius"
                data-unit="px"
              />
            </div>
            <div class="set-row">
              <label for="th-outline" data-i18n="theme.outline"></label>
              <input
                type="range"
                id="th-outline"
                min="0"
                max="6"
                data-var="--line-width"
                data-unit="px"
              />
            </div>
            <div class="set-row">
              <label for="th-opacity" data-i18n="theme.opacity"></label>
              <input
                type="range"
                id="th-opacity"
                min="0"
                max="1"
                step="0.02"
                data-var="--widget-opacity"
              />
            </div>
            <div class="set-row">
              <label for="th-cell" data-i18n="theme.cell"></label>
              <input
                type="range"
                id="th-cell"
                min="48"
                max="160"
                step="4"
                data-var="--cell"
                data-unit="px"
              />
            </div>
            <div class="set-row">
              <button id="th-reset" data-i18n="set.appearance.reset"></button>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="set.appearance.board"></legend>
            <div class="set-row">
              <label for="ap-header" data-i18n="set.header"></label>
              <select id="ap-header" data-ui="header">
                <option value="hover" data-i18n="set.header.hover"></option>
                <option value="always" data-i18n="set.header.always"></option>
                <option value="hidden" data-i18n="set.header.hidden"></option>
              </select>
            </div>
            <div class="set-row">
              <label for="ap-density" data-i18n="set.density"></label>
              <select id="ap-density" data-ui="density">
                <option
                  value="compact"
                  data-i18n="set.density.compact"
                ></option>
                <option value="normal" data-i18n="set.density.normal"></option>
                <option value="roomy" data-i18n="set.density.roomy"></option>
              </select>
            </div>
            <div class="set-row">
              <label for="ap-frame" data-i18n="set.frame"></label>
              <select id="ap-frame" data-ui="frame">
                <option value="none" data-i18n="look.frame.none"></option>
                <option value="corners" data-i18n="look.frame.corners"></option>
                <option value="double" data-i18n="look.frame.double"></option>
                <option value="stitch" data-i18n="look.frame.stitch"></option>
                <option value="dots" data-i18n="look.frame.dots"></option>
                <option value="ornate" data-i18n="look.frame.ornate"></option>
                <option value="pixel" data-i18n="look.frame.pixel"></option>
                <option value="tape" data-i18n="look.frame.tape"></option>
              </select>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="set.appearance.advanced"></legend>
            <p class="hint" data-i18n="ai.paste_help"></p>
            <div class="set-row set-add">
              <button id="th-ai-copy" data-i18n="ai.copy"></button>
              <button
                id="th-ai-paste"
                class="primary"
                data-i18n="ai.paste"
              ></button>
              <button id="th-undo" data-i18n="ai.undo" hidden></button>
              <button id="th-file" data-i18n="theme.open_file"></button>
            </div>
            <div id="th-paste" hidden>
              <textarea
                id="th-paste-text"
                spellcheck="false"
                rows="6"
                style="width: 100%"
              ></textarea>
              <div id="th-paste-result" aria-live="polite"></div>
              <div class="set-row set-add">
                <button
                  id="th-paste-apply"
                  class="primary"
                  data-i18n="ai.apply"
                ></button>
                <button id="th-paste-cancel" data-i18n="set.close"></button>
              </div>
            </div>
          </fieldset>
        </section>
        <section data-page="widgets" hidden>
          <h2 data-i18n="set.nav.widgets">위젯과 배치</h2>

          <fieldset>
            <legend data-i18n="set.widgets.list_legend"></legend>
            <div id="wg-list" class="set-list"></div>
            <div class="set-row set-add">
              <select id="wg-add-type"></select>
              <button id="wg-add" data-i18n="set.widgets.add"></button>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="set.widgets.layout_legend"></legend>
            <div class="set-row">
              <label for="wg-lock" data-i18n="set.lock"></label>
              <input type="checkbox" id="wg-lock" data-ui="lockLayout" />
            </div>
            <div class="set-row">
              <label data-i18n="set.widgets.edit"></label>
              <button id="wg-edit" data-i18n="set.widgets.edit_btn"></button>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="lay.builtin"></legend>
            <div class="set-row set-add">
              <button id="wg-preset-work" data-preset="work">
                <span data-i18n="lay.work"></span>
              </button>
              <button id="wg-preset-study" data-preset="study">
                <span data-i18n="lay.study"></span>
              </button>
              <button id="wg-preset-oshi" data-preset="oshi">
                <span data-i18n="lay.oshi"></span>
              </button>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="lay.saved"></legend>
            <div id="wg-layouts" class="set-list"></div>
            <div class="set-row set-add">
              <input
                type="text"
                id="wg-layout-name"
                maxlength="40"
                data-i18n-placeholder="lay.name"
              />
              <button id="wg-layout-save" data-i18n="lay.save"></button>
              <button id="wg-layout-undo" data-i18n="lay.undo" hidden></button>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="set.bin.legend"></legend>
            <p class="hint" data-i18n="set.bin.hint"></p>
            <div id="wg-bin" class="set-list"></div>
            <div class="set-row set-add">
              <button id="wg-bin-empty" data-i18n="set.bin.empty"></button>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="set.archive.legend"></legend>
            <div class="set-row">
              <label for="wg-archive" data-i18n="set.archive.toggle"></label>
              <input
                type="checkbox"
                id="wg-archive"
                aria-describedby="wg-archive-hint"
              />
            </div>
            <p
              class="hint"
              id="wg-archive-hint"
              data-i18n="set.archive.hint"
            ></p>
            <div id="wg-archive-list" class="set-list"></div>
          </fieldset>
        </section>
        <section data-page="timer" hidden>
          <h2 data-i18n="set.nav.timer">타이머 · 달력</h2>

          <fieldset>
            <legend data-i18n="set.timer.alarm"></legend>
            <div class="set-row">
              <label for="timer-sound" data-i18n="set.sound"></label>
              <input type="checkbox" id="timer-sound" data-ui="timerSound" />
            </div>
            <div class="set-row">
              <label for="timer-volume" data-i18n="set.volume"></label>
              <input
                type="range"
                id="timer-volume"
                min="0"
                max="100"
                step="5"
                data-ui="timerVolume"
              />
            </div>
            <div class="set-row">
              <label for="timer-rings" data-i18n="set.rings"></label>
              <select id="timer-rings" data-ui="timerRings">
                <option value="1">1</option>
                <option value="3">3</option>
                <option value="10">10</option>
                <option value="30">30</option>
              </select>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="set.timer.presets"></legend>
            <p class="hint" data-i18n="set.timer.presets_hint"></p>
            <div id="timer-presets" class="set-list"></div>
            <button
              id="timer-preset-add"
              data-i18n="set.timer.add_preset"
            ></button>
          </fieldset>

          <fieldset>
            <legend data-i18n="set.cal.holidays"></legend>
            <div class="set-row">
              <label for="cal-country" data-i18n="set.cal.country"></label>
              <select id="cal-country">
                <option value="KR" data-i18n="set.cal.country_kr"></option>
                <option value="none" data-i18n="set.cal.country_none"></option>
              </select>
            </div>

            <h4 data-i18n="set.cal.custom"></h4>
            <div id="cal-add-list" class="set-list"></div>
            <div class="set-row set-add">
              <input
                type="date"
                id="cal-add-date"
                aria-label="date"
                data-i18n-title="set.cal.date"
              />
              <input
                type="text"
                id="cal-add-name"
                data-i18n-placeholder="set.cal.name_ph"
              />
              <button id="cal-add-btn" data-i18n="set.cal.add"></button>
            </div>

            <h4 data-i18n="set.cal.excluded"></h4>
            <p class="hint" data-i18n="set.cal.excluded_hint"></p>
            <div id="cal-remove-list" class="set-list"></div>
            <div class="set-row set-add">
              <input
                type="date"
                id="cal-remove-date"
                aria-label="date"
                data-i18n-title="set.cal.date"
              />
              <button id="cal-remove-btn" data-i18n="set.cal.exclude"></button>
            </div>
          </fieldset>
        </section>
        <section data-page="a11y" hidden>
          <h2 data-i18n="set.nav.a11y">접근성</h2>
          <p class="hint" data-i18n="set.access_note"></p>
          <div class="set-row">
            <label for="a11y-motion" data-i18n="set.motion"></label>
            <input type="checkbox" id="a11y-motion" />
          </div>

          <fieldset>
            <legend data-i18n="set.g.motor"></legend>
            <div class="set-row">
              <label for="a11y-hotkey" data-i18n="set.hotkey"></label>
              <select id="a11y-hotkey" data-ui="hotkey">
                <option value="" data-i18n="set.off"></option>
                <option value="Ctrl+Alt+W">Ctrl + Alt + W</option>
                <option value="Ctrl+Alt+Space">Ctrl + Alt + Space</option>
                <option value="Ctrl+Shift+F12">Ctrl + Shift + F12</option>
              </select>
            </div>
            <div class="set-row">
              <label for="a11y-dwell" data-i18n="set.dwell"></label>
              <select id="a11y-dwell" data-ui="dwellMs">
                <option value="0" data-i18n="set.off"></option>
                <option value="400" data-i18n="set.dwell.short"></option>
                <option value="800" data-i18n="set.dwell.mid"></option>
                <option value="1500" data-i18n="set.dwell.long"></option>
              </select>
            </div>
            <div class="set-row">
              <label for="a11y-clickDrag" data-i18n="set.clickdrag"></label>
              <input type="checkbox" id="a11y-clickDrag" data-ui="clickDrag" />
            </div>
            <div class="set-row">
              <label for="a11y-bigTargets" data-i18n="set.big"></label>
              <input
                type="checkbox"
                id="a11y-bigTargets"
                data-ui="bigTargets"
              />
            </div>
            <div class="set-row">
              <label for="a11y-showControls" data-i18n="set.controls"></label>
              <input
                type="checkbox"
                id="a11y-showControls"
                data-ui="showControls"
              />
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="set.g.vision"></legend>
            <div class="set-row">
              <label for="a11y-zoom" data-i18n="set.zoom"></label>
              <select id="a11y-zoom" data-ui="zoom">
                <option value="1">100%</option>
                <option value="1.25">125%</option>
                <option value="1.5">150%</option>
                <option value="1.75">175%</option>
                <option value="2">200%</option>
              </select>
            </div>
            <div class="set-row">
              <label for="a11y-highContrast" data-i18n="set.hc"></label>
              <input
                type="checkbox"
                id="a11y-highContrast"
                data-ui="highContrast"
              />
            </div>
            <div class="set-row">
              <label for="a11y-wideText" data-i18n="set.wide"></label>
              <input type="checkbox" id="a11y-wideText" data-ui="wideText" />
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="set.g.hearing"></legend>
            <div class="set-row">
              <label for="a11y-flashAlert" data-i18n="set.flash"></label>
              <input
                type="checkbox"
                id="a11y-flashAlert"
                data-ui="flashAlert"
              />
            </div>
            <div class="set-row">
              <label for="a11y-notifyAlert" data-i18n="set.notify"></label>
              <input
                type="checkbox"
                id="a11y-notifyAlert"
                data-ui="notifyAlert"
              />
            </div>
            <div class="set-row">
              <label for="a11y-soundCaptions" data-i18n="set.captions"></label>
              <input
                type="checkbox"
                id="a11y-soundCaptions"
                data-ui="soundCaptions"
              />
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="set.g.color"></legend>
            <div class="set-row">
              <label for="a11y-cvd" data-i18n="set.cvd"></label>
              <input type="checkbox" id="a11y-cvd" data-ui="cvd" />
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="set.g.cognitive"></legend>
            <div class="set-row">
              <label for="a11y-showHints" data-i18n="set.hints"></label>
              <input type="checkbox" id="a11y-showHints" data-ui="showHints" />
            </div>
            <div class="set-row">
              <label for="a11y-announceSummary" data-i18n="set.announce"></label>
              <input
                type="checkbox"
                id="a11y-announceSummary"
                data-ui="announceSummary"
              />
            </div>
            <div class="set-row">
              <label for="a11y-readableFont" data-i18n="set.readable"></label>
              <select id="a11y-readableFont" data-ui="readableFont">
                <option value="none" data-i18n="set.readable.none"></option>
                <option value="atkinson">Atkinson Hyperlegible</option>
                <option value="lexend">Lexend</option>
                <option value="opendyslexic">OpenDyslexic</option>
              </select>
            </div>
            <div class="set-row">
              <label for="a11y-shortLines" data-i18n="set.short"></label>
              <input
                type="checkbox"
                id="a11y-shortLines"
                data-ui="shortLines"
              />
            </div>
            <div class="set-row">
              <label for="a11y-reminderTime" data-i18n="set.remind"></label>
              <input
                type="time"
                id="a11y-reminderTime"
                data-ui="reminderTime"
              />
            </div>
          </fieldset>

          <p class="hint" data-i18n="set.keys"></p>
        </section>
        <section data-page="backup" hidden>
          <h2 data-i18n="set.nav.backup">백업 · 데이터</h2>

          <fieldset>
            <legend data-i18n="set.backup.now_legend"></legend>
            <div class="set-row">
              <label data-i18n="set.backup.location"></label>
              <button id="backup-open" data-i18n="set.backup.open"></button>
            </div>
            <p class="hint" id="backup-location"></p>
            <div class="set-row">
              <button
                id="backup-now"
                class="primary"
                data-i18n="set.backup.now"
              ></button>
              <span class="hint" id="backup-now-msg" aria-live="polite"></span>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="set.backup.auto_legend"></legend>
            <div class="set-row">
              <label for="backup-auto" data-i18n="set.backup.auto"></label>
              <select id="backup-auto">
                <option value="off" data-i18n="set.off"></option>
                <option value="daily" data-i18n="set.backup.daily"></option>
                <option value="weekly" data-i18n="set.backup.weekly"></option>
              </select>
            </div>
            <div class="set-row">
              <label for="backup-keep" data-i18n="set.backup.keep"></label>
              <input type="number" id="backup-keep" min="1" max="99" />
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="set.backup.restore_legend"></legend>
            <p class="hint" data-i18n="set.backup.restore_hint"></p>
            <div id="backup-list" class="set-list"></div>
          </fieldset>

          <fieldset>
            <legend data-i18n="set.backup.data_legend"></legend>
            <div class="set-row">
              <button
                id="backup-config"
                data-i18n="set.backup.open_config"
              ></button>
            </div>
          </fieldset>
        </section>
        <section data-page="about" hidden>
          <h2 data-i18n="set.nav.about">정보 · 업데이트</h2>
          <p id="about-version"></p>
          <fieldset>
            <legend data-i18n="upd.title"></legend>
            <div class="set-row">
              <label for="about-update" data-i18n="upd.check"></label>
              <select id="about-update">
                <option value="weekly" data-i18n="upd.weekly"></option>
                <option value="daily" data-i18n="upd.daily"></option>
                <option value="off" data-i18n="set.off"></option>
              </select>
            </div>
            <p class="hint" id="about-update-status" aria-live="polite"></p>
            <div class="set-row">
              <button id="about-update-now" data-i18n="upd.now"></button>
            </div>
            <div id="about-update-offer" hidden>
              <p id="about-update-title"></p>
              <pre id="about-update-notes" class="hint"></pre>
              <div class="set-row">
                <button id="about-update-apply" class="primary"></button>
                <button id="about-update-later" data-i18n="upd.later"></button>
                <button id="about-update-skip" data-i18n="upd.skip"></button>
              </div>
            </div>
          </fieldset>
          <details class="set-licenses">
            <summary data-i18n="set.about.licenses"></summary>
            <p class="hint" data-i18n="set.about.licenses_body"></p>
          </details>
        </section>
      </main>
    </div>
    <script type="module" src="settings.js"></script>
  </body>
</html>
