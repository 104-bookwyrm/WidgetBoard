<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="lib.title">위젯 메뉴</title>
    <link rel="stylesheet" href="default-theme.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      /* An opaque window like Settings. */
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--c1);
        color: var(--c3);
        font: var(--font-size, 14px) / 1.5 var(--font);
        display: flex;
        flex-direction: column;
      }
      .lib-tabs {
        display: flex;
        gap: 4px;
        padding: 10px 16px 0;
        border-bottom: var(--line-width) var(--line-style) var(--line-color);
      }
      .lib-tabs button {
        border-radius: 6px 6px 0 0;
        border-bottom: 0;
      }
      .lib-tabs button[aria-selected="true"] {
        background: var(--c2);
        color: #fff;
      }
      /* 내 위젯, laid out like Browse: items by type | every item of that type | the selected one's card */
      .lib-items {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr) 220px;
      }
      .mine-list {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-right: var(--line-width) var(--line-style) var(--line-color);
      }
      .mine-top {
        padding: 10px 8px 4px;
      }
      .mine-rows {
        overflow-y: auto;
        padding: 0 8px 12px;
      }
      .mine-rows h3 {
        display: flex;
        margin: 12px 8px 4px;
        font-size: 0.8em;
        font-weight: normal;
        color: var(--text-muted);
      }
      .mine-rows h3 span {
        margin-left: auto;
      }
      .mine-rows button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 8px;
        border: 0;
        border-radius: 6px;
        background: none;
        text-align: start;
      }
      .mine-rows button .t {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mine-rows button[aria-current="true"] {
        background: var(--c2);
        color: #fff;
      }
      .mine-rows .gone {
        color: var(--text-muted);
      }
      /* filled dot = on the board, ring = kept here only */
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: none;
        box-sizing: border-box;
        border: 1.5px solid currentColor;
        opacity: 0.55;
      }
      .dot.on {
        background: currentColor;
        opacity: 0.9;
      }
      .mine-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 16px;
        overflow-y: auto;
        border-left: var(--line-width) var(--line-style) var(--line-color);
      }
      .mine-card p {
        margin: 0;
      }
      .mine-card .kind {
        color: var(--text-muted);
        font-size: 0.85em;
      }
      .mine-card h2 {
        margin: 0;
        font-size: 1.3em;
      }
      .mine-name {
        all: unset;
        cursor: text;
        border-radius: 4px;
        overflow-wrap: anywhere;
      }
      .mine-name:hover,
      .mine-name:focus-visible {
        outline: 1px dashed var(--line-color);
        outline-offset: 2px;
      }
      .mine-card .where {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.9em;
      }
      .mine-card .meta {
        color: var(--text-muted);
        font-size: 0.85em;
      }
      .mine-links {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
      }
      .mine-links button {
        background: none;
        border-color: transparent;
        color: var(--text-muted);
        padding: 2px 6px;
      }
      .mine-links button:hover {
        border-color: var(--line-color);
        color: var(--c3);
      }
      .mine-links .danger:hover {
        color: var(--danger);
        border-color: var(--danger);
      }
      .mine-links .ask {
        font-size: 0.85em;
        width: 100%;
      }
      .mine-card > .primary {
        margin-top: auto;
      }
      .mine-card input {
        font: inherit;
        width: 100%;
        box-sizing: border-box;
      }
      .lib-layouts {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px 16px;
      }
      .lib-layouts h2 {
        font-size: 1em;
        margin: 16px 0 6px;
      }
      .lay-presets {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 8px;
      }
      .lay-presets button {
        text-align: start;
        padding: 8px 10px;
      }
      .lay-presets small {
        display: block;
        color: var(--text-muted);
      }
      .lay-row {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 0;
      }
      .lay-row .grow {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lay-name {
        flex: 1;
        font: inherit;
      }
      .lib-history {
        position: fixed;
        inset: 24px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 14px;
        overflow-y: auto;
        border-radius: var(--radius, 8px);
        background: var(--c1);
        border: var(--line-width) var(--line-style) var(--line-color);
        box-shadow: 0 8px 30px rgb(0 0 0 / 0.35);
      }
      .lib-history .head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .lib-history .head b {
        flex: 1;
      }
      .lib-history .ver {
        border-top: var(--line-width) var(--line-style) var(--line-color);
        padding-top: 6px;
      }
      .lib-history pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 4px 0;
        font: inherit;
      }
      .lib-search {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 4px 8px;
      }
      .lib-results {
        grid-column: 1 / -1;
        margin: 8px 0 0;
      }
      .lib-results h2,
      .lib-grid > h2 {
        font-size: 0.85em;
        font-weight: normal;
        color: var(--text-muted);
        margin: 0 0 4px;
      }
      .lib-grid > h2 {
        grid-column: 1 / -1;
        margin: 0;
      }
      .lib-row {
        display: flex;
        gap: 10px;
        width: 100%;
        text-align: start;
        padding: 6px 8px;
        margin-bottom: 4px;
      }
      .lib-row .when {
        flex: none;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }
      .lib-row .what {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      mark {
        background: color-mix(in srgb, var(--c2) 35%, transparent);
        color: inherit;
      }
      /* every item of the selected type at once; the selected one is outlined */
      .lib-grid {
        min-width: 0;
        overflow-y: auto;
        padding: 16px 20px 20px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        grid-auto-rows: min-content;
        gap: 14px;
        align-content: start;
      }
      .lib-card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
        cursor: pointer;
      }
      .lib-card[aria-current="true"] .lib-preview {
        outline: 3px solid var(--c2);
        outline-offset: 3px;
      }
      .lib-card:focus-visible {
        outline: none;
      }
      .lib-card:focus-visible .lib-preview {
        box-shadow: 0 0 0 2px var(--c3);
      }
      .lib-card h3 {
        margin: 0 2px;
        font-size: 0.85em;
        font-weight: normal;
        color: var(--text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lib-preview {
        aspect-ratio: 1;
        box-sizing: border-box;
        padding: 12px;
        overflow: hidden;
        border-radius: var(--radius, 8px);
        border: var(--line-width) var(--line-style) var(--line-color);
        background: color-mix(in srgb, var(--c3) 4%, var(--c1));
        color: var(--text-muted);
        font-size: 0.9em;
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        transition: transform 0.12s;
      }
      .lib-card:hover .lib-preview {
        transform: translateY(-2px);
      }
      .lib-preview.memo {
        color: #2a2a2a;
        border-color: transparent;
      }
      .lib-preview.media {
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .lib-preview img {
        width: 100%;
        min-height: 0;
        flex: 1;
        object-fit: cover;
        border-radius: 4px;
        display: block;
      }
      .lib-preview.clock {
        display: grid;
        place-content: center;
        text-align: center;
      }
      .lib-preview .big {
        font-size: 2em;
        font-weight: 600;
        color: var(--c3);
        font-variant-numeric: tabular-nums;
      }
      .lib-card.gone .lib-preview {
        opacity: 0.55;
        filter: grayscale(0.6);
      }
      .lib-empty {
        grid-column: 1 / -1;
        color: var(--text-muted);
        text-align: center;
        padding: 40px 0;
      }
      /* Browse: widget list | the live widget, centred | a short card */
      .lib-browse {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr) 220px;
      }
      .gal-list {
        overflow-y: auto;
        padding: 6px 8px 12px;
        border-right: var(--line-width) var(--line-style) var(--line-color);
      }
      .gal-list h3 {
        margin: 12px 8px 4px;
        font-size: 0.8em;
        font-weight: normal;
        color: var(--text-muted);
      }
      .gal-list button {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 6px 8px;
        border: 0;
        border-radius: 6px;
        background: none;
        text-align: start;
      }
      .gal-list button[aria-current="true"] {
        background: var(--c2);
        color: #fff;
      }
      .gal-new {
        margin-left: auto;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--c2);
        color: #fff;
        font-size: 0.75em;
      }
      .gal-stage {
        position: relative;
        min-width: 0;
      }
      .gal-stage iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
      }
      .gal-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 16px;
        overflow-y: auto;
        border-left: var(--line-width) var(--line-style) var(--line-color);
      }
      .gal-card h2 {
        margin: 0;
        font-size: 1.3em;
      }
      .gal-group {
        margin: 0;
        color: var(--text-muted);
        font-size: 0.85em;
      }
      .gal-notes {
        margin: 4px 0 0;
        padding-left: 1.1em;
      }
      .gal-notes li + li {
        margin-top: 6px;
      }
      .gal-add {
        margin-top: auto;
      }
      .lib-flash {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 999px;
        background: var(--c3);
        color: var(--c1);
        font-size: 0.9em;
      }
    </style>
  </head>
  <body class="app-window">
    <div class="lib-tabs" role="tablist">
      <button role="tab" data-tab="items" data-i18n="lib.items_tab"></button>
      <button role="tab" data-tab="browse" data-i18n="lib.browse_tab"></button>
      <button role="tab" data-tab="layouts" data-i18n="lib.layouts_tab"></button>
    </div>
    <div class="lib-items">
      <nav class="mine-list">
        <div class="mine-top"><input class="lib-search" type="search" data-i18n-placeholder="lib.search" /></div>
        <div class="mine-rows"></div>
      </nav>
      <main class="lib-grid" aria-live="polite"></main>
      <aside class="mine-card"></aside>
    </div>
    <div class="lib-browse" hidden>
      <nav class="gal-list" data-i18n-aria-label="lib.browse_tab"></nav>
      <div class="gal-stage"><iframe title=""></iframe></div>
      <aside class="gal-card" aria-live="polite">
        <p class="gal-group"></p>
        <h2></h2>
        <ul class="gal-notes"></ul>
        <button class="gal-add primary" data-i18n="lib.gal_add"></button>
      </aside>
    </div>
    <main class="lib-layouts" hidden>
      <p class="hint" data-i18n="lay.help"></p>
      <h2 data-i18n="lay.builtin"></h2>
      <div class="lay-presets"></div>
      <h2 data-i18n="lay.saved"></h2>
      <div class="lay-saved"></div>
      <div class="lay-row">
        <input class="lay-name" maxlength="40" data-i18n-placeholder="lay.name" />
        <button class="lay-save primary" data-i18n="lay.save"></button>
        <button class="lay-undo" data-i18n="lay.undo" hidden></button>
      </div>
    </main>
    <div class="lib-history" role="dialog" aria-modal="true" hidden></div>
    <div class="lib-flash" role="status" hidden></div>
    <script type="module" src="library.js"></script>
  </body>
</html>
