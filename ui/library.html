<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="lib.title">보관함</title>
    <link rel="stylesheet" href="base.css" />
    <style>
      /* An opaque window like Settings. */
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--c1);
        color: var(--c3);
        font: var(--font-size, 14px) / 1.5 var(--font);
        display: flex;
        flex-direction: column;
      }
      .lib-tabs {
        display: flex;
        gap: 4px;
        padding: 10px 16px 0;
        border-bottom: var(--line-width) var(--line-style) var(--line-color);
      }
      .lib-tabs button {
        border-radius: 6px 6px 0 0;
        border-bottom: 0;
      }
      .lib-tabs button[aria-selected="true"] {
        background: var(--c2);
        color: #fff;
      }
      .lib-items {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .lib-layouts {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px 16px;
      }
      .lib-layouts h2 {
        font-size: 1em;
        margin: 16px 0 6px;
      }
      .lay-presets {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 8px;
      }
      .lay-presets button {
        text-align: start;
        padding: 8px 10px;
      }
      .lay-presets small {
        display: block;
        color: var(--text-muted);
      }
      .lay-row {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 0;
      }
      .lay-row .grow {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lay-name {
        flex: 1;
        font: inherit;
      }
      .lib-history {
        position: fixed;
        inset: 24px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 14px;
        overflow-y: auto;
        border-radius: var(--radius, 8px);
        background: var(--c1);
        border: var(--line-width) var(--line-style) var(--line-color);
        box-shadow: 0 8px 30px rgb(0 0 0 / 0.35);
      }
      .lib-history .head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .lib-history .head b {
        flex: 1;
      }
      .lib-history .ver {
        border-top: var(--line-width) var(--line-style) var(--line-color);
        padding-top: 6px;
      }
      .lib-history pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 4px 0;
        font: inherit;
      }
      .lib-top {
        padding: 12px 16px 0;
      }
      .lib-search {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 6px 10px;
      }
      .lib-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 16px;
      }
      .lib-results {
        grid-column: 1 / -1;
        margin: 8px 0 0;
      }
      .lib-results h2 {
        font-size: 0.9em;
        color: var(--text-muted);
        margin: 0 0 4px;
      }
      .lib-row {
        display: flex;
        gap: 10px;
        width: 100%;
        text-align: start;
        padding: 6px 8px;
        margin-bottom: 4px;
      }
      .lib-row .when {
        flex: none;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }
      .lib-row .what {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      mark {
        background: color-mix(in srgb, var(--c2) 35%, transparent);
        color: inherit;
      }
      .lib-chips button[aria-pressed="true"] {
        background: var(--c2);
        color: #fff;
      }
      .lib-grid {
        flex: 1;
        overflow-y: auto;
        padding: 8px 16px 16px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        grid-auto-rows: min-content;
        gap: 10px;
      }
      .lib-card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px;
        border-radius: var(--radius, 8px);
        border: var(--line-width) var(--line-style) var(--line-color);
        background: color-mix(in srgb, var(--c3) 4%, var(--c1));
        min-height: 150px;
      }
      .lib-card h3 {
        margin: 0;
        font-size: 1em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lib-card input {
        font: inherit;
        width: 100%;
        box-sizing: border-box;
      }
      .lib-preview {
        flex: 1;
        min-height: 60px;
        color: var(--text-muted);
        font-size: 0.9em;
        overflow: hidden;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
      }
      .lib-preview.memo {
        color: #2a2a2a;
        padding: 6px;
        border-radius: 4px;
      }
      .lib-preview img {
        width: 100%;
        height: 80px;
        object-fit: cover;
        border-radius: 4px;
        display: block;
      }
      .lib-preview .big {
        font-size: 1.6em;
        font-weight: 600;
        color: var(--c3);
        font-variant-numeric: tabular-nums;
      }
      .lib-type {
        font-size: 0.8em;
        color: var(--text-faint);
      }
      .lib-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .lib-actions .badge {
        font-size: 0.8em;
        color: var(--c2);
        margin-inline-end: auto;
      }
      .lib-empty {
        grid-column: 1 / -1;
        color: var(--text-muted);
        text-align: center;
        padding: 40px 0;
      }
      .lib-flash {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 999px;
        background: var(--c3);
        color: var(--c1);
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="lib-tabs" role="tablist">
      <button role="tab" data-tab="items" data-i18n="lib.items_tab"></button>
      <button role="tab" data-tab="layouts" data-i18n="lib.layouts_tab"></button>
    </div>
    <div class="lib-items">
      <div class="lib-top">
        <input class="lib-search" type="search" data-i18n-placeholder="lib.search" />
      </div>
      <nav class="lib-chips" role="toolbar"></nav>
      <main class="lib-grid" aria-live="polite"></main>
    </div>
    <main class="lib-layouts" hidden>
      <p class="hint" data-i18n="lay.help"></p>
      <h2 data-i18n="lay.builtin"></h2>
      <div class="lay-presets"></div>
      <h2 data-i18n="lay.saved"></h2>
      <div class="lay-saved"></div>
      <div class="lay-row">
        <input class="lay-name" maxlength="40" data-i18n-placeholder="lay.name" />
        <button class="lay-save primary" data-i18n="lay.save"></button>
        <button class="lay-undo" data-i18n="lay.undo" hidden></button>
      </div>
    </main>
    <div class="lib-history" role="dialog" aria-modal="true" hidden></div>
    <div class="lib-flash" role="status" hidden></div>
    <script type="module" src="library.js"></script>
  </body>
</html>
